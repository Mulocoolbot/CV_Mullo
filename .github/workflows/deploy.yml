name: Verify, Build & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  VITE_CONFIG_NATIVE_IGNORE_WARNING: "true"

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Run Black Box test suite
        run: npm test

      - name: Build static export for GitHub Pages
        env:
          NEXT_PUBLIC_BASE_PATH: "/CV_Mullo"
          NEXT_PUBLIC_GMAIL_API_URL: "https://script.google.com/macros/s/AKfycbwRvh7ZkZ5XEhVB1VA_rG08x4NVayVkrsCUi5PMvggdC6j6GlR2LHh7afbi59NWKGA2/exec"
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: verify-and-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
